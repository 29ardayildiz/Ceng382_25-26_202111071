<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    
  <link rel="stylesheet" href="tableStyle.css">
</head>
<body>
    <h2>Class Information Input</h2>
    <form id="classForm">
        <input type="text" id="className" placeholder="Class Name" required>
        <input type="number" id="numPeople" placeholder="Number of People" required>
        <textarea id="description" placeholder="Description" required></textarea>
        <button type="submit">Add Class</button>
    </form>
    
    <h2>Class Table</h2>
    <table id="classTable">
        <thead>
            <tr>
                <th>Class Name</th>
                <th>Number of People</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        document.getElementById("classForm").addEventListener("submit", function(event) {
            event.preventDefault();
            let className = document.getElementById("className").value.trim();
            let numPeople = document.getElementById("numPeople").value.trim();
            let description = document.getElementById("description").value.trim();
            
            if (className === "" || numPeople === "" || description === "") {
                alert("All fields must be filled out");
                return;
            }
            
            let table = document.getElementById("classTable").getElementsByTagName('tbody')[0];
            let newRow = table.insertRow();
            newRow.innerHTML = `<td>${className}</td><td>${numPeople}</td><td>${description}</td>`;
            
            // Mouseover event
            newRow.addEventListener("mouseover", function() {
                this.style.backgroundColor = "#ddd";
            });
            // Mouseout event
            newRow.addEventListener("mouseout", function() {
                this.style.backgroundColor = "";
            });
            
            document.getElementById("classForm").reset();
        });

        document.querySelectorAll("input, textarea").forEach(input => {
            // Focus event
            input.addEventListener("focus", function() {
                this.style.border = "2px solid green";
            });
            // Blur event
            input.addEventListener("blur", function() {
                if (this.value.trim() === "") {
                    this.classList.add("invalid");
                } else {
                    this.classList.remove("invalid");
                    this.style.border = "1px solid #ccc";
                }
            });
        });
    </script>
</body>
</html>
