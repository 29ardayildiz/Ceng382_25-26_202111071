<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darth Vader Login Page</title>
  <link rel="stylesheet" href="bb8.css">
  <link rel="stylesheet" href="darthVader.css">
  <link rel="stylesheet" href="lightSword.css">

</head>

<body>
  <div class="container">
    <div class="darth">
      <div class="helmet">
        <div class="dome">
        </div>
        <div class="hood">
          <div class="left"></div>
          <div class="right"></div>
        </div>
        <div class="ridge"></div>
      </div>
      <div class="mask">
        <div class="neck"></div>
        <div class="eyes">
          <div class="left"></div>
          <div class="right"></div>
        </div>
        <div class="cheeks">
          <div class="left"></div>
          <div class="right"></div>
        </div>
        <div class="snout">
          <div class="left"></div>
          <div class="right"></div>
          <div class="vent">
            <div class="left"></div>
            <div class="right"></div>
          </div>
          <div class="nose"></div>
          <div class="tusks"></div>
        </div>
        <div class="chin">
          <div class="vent"></div>
        </div>
      </div>
    </div>

    <div class="login-container">
      <form class="login-form">
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="login-btn">LOGIN TO THE DARK SIDE</button>
      </form>
    </div>

    <div class="bb8">
      <div class="bb8Head">
        <div class="lens"></div>
        <div class="bodyDot headDot"></div>
      </div>
      <div class="bb8Body">
        <div class="circle bodyCircle1">
          <div class="innerCircle1"></div>
        </div>
        <div class="circle bodyCircle2">
          <div class="innerCircle1"></div>
        </div>
        <div class="circle bodyCircle3">
          <div class="innerCircle3"></div>
        </div>
        <div class="bodyDot bodyDot1"></div>
        <div class="bodyDot bodyDot2"></div>
        <div class="bodyLine1"></div>
        <div class="bodyLine2"></div>
        <div class="bodyLine3"></div>
      </div>
    </div>

    <div class="lightsaber lightsaber-1"></div>
    <div class="lightsaber lightsaber-2"></div>
    <div class="lightsaber lightsaber-3"></div>
    <div class="lightsaber lightsaber-4"></div>
  </div>


</body>

</html>
